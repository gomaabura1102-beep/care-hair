name: Sync Care Hair production

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with verified source
        run: |
          unzip -o care-hair-admin-login-04e06d3.zip -d .
          rm -f care-hair-admin-login-04e06d3.zip .github/workflows/sync-care-hair.yml
          git config user.name "care-hair-sync"
          git config user.email "care-hair-sync@users.noreply.github.com"
          git add -A
          git commit -m "Add secure admin login"
          git push

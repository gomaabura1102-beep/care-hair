name: Sync Care Hair production

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with the verified production source
        run: |
          unzip -o care-hair-sync-3615e45.zip -d .
          rm -f care-hair-sync-3615e45.zip .github/workflows/sync-care-hair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Sync current Care Hair production"
          git push

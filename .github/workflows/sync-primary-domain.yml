name: Sync Care Hair primary domain

on:
  push:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with primary domain source
        run: |
          unzip -o care-hair-primary-domain-dfd979a.zip -d .
          rm -f care-hair-primary-domain-dfd979a.zip .github/workflows/sync-primary-domain.yml
          git config user.name "care-hair-sync"
          git config user.email "care-hair-sync@users.noreply.github.com"
          git add -A
          git commit -m "Serve latest site on primary domain"
          git push
